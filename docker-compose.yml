version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: styliste-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stylist@root321}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-styliste_db}
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-stylist_user}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-stylist@321}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - styliste-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: styliste-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8010
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/styliste_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-stylist_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-stylist@321}
      JWT_SECRET: ${JWT_SECRET:-V++rtkXU/o3lDiqyholA7pqyCDPZpeTgoSP6cYoRB4fwlf9Fq7gdx/EkTK9wZxe6ZDOwgP2UZqzAqL+lJJSbKQ==}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://styliste-couturier.com,https://www.styliste-couturier.com,http://localhost:5173,http://localhost:3000}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-ashwinimanema@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-fpmw ijqw yrag vvpv}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_live_TkDjPQoSxTSOSM}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-N0Ulm5Zc6TWJzOXFiYspXcOY}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-maneashwini2314@gmail.com}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-G&KZLXHzgsYBPMVmf2wo6P$J6d!cT9r7}
      OUTSCRAPER_API_KEY: ${OUTSCRAPER_API_KEY:-}
    ports:
      - "8010:8010"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - styliste-network

volumes:
  mysql_data:
  uploads_data:

networks:
  styliste-network:
    driver: bridge
